<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProductivityZen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 400px;
            min-height: 500px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .header {
            padding: 20px;
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tagline {
            font-size: 12px;
            opacity: 0.8;
        }

        .content {
            padding: 20px;
        }

        .tab-nav {
            display: flex;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 4px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            background: none;
            color: white;
            cursor: pointer;
            border-radius: 20px;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.8;
        }

        .current-site {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .site-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .site-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .site-details h3 {
            font-size: 14px;
            margin-bottom: 4px;
        }

        .site-details p {
            font-size: 12px;
            opacity: 0.8;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .goal-input {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .goal-input input {
            flex: 1;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 14px;
        }

        .goal-input input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
        }

        .top-sites {
            max-height: 200px;
            overflow-y: auto;
        }

        .site-item {
            display: flex;
            justify-content: between;
            align-items: center;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            margin-bottom: 8px;
            backdrop-filter: blur(10px);
        }

        .site-name {
            font-size: 14px;
            flex: 1;
        }

        .site-time {
            font-size: 12px;
            opacity: 0.8;
        }

        .loading {
            text-align: center;
            padding: 40px;
            opacity: 0.8;
        }

        .zen-mode {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            margin-bottom: 15px;
        }

        .zen-btn {
            background: linear-gradient(135deg, #ff6b6b 0%, #feca57 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .zen-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            🧘 ProductivityZen
        </div>
        <div class="tagline">Mindful productivity tracking</div>
    </div>

    <div class="content">
        <div class="tab-nav">
            <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
            <button class="tab-btn" data-tab="goals">Goals</button>
            <button class="tab-btn" data-tab="analytics">Analytics</button>
        </div>

        <!-- Dashboard Tab -->
        <div class="tab-content active" id="dashboard">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="todayTime">0h 0m</div>
                    <div class="stat-label">Today</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="productivityScore">85%</div>
                    <div class="stat-label">Score</div>
                </div>
            </div>

            <div class="current-site" id="currentSite">
                <div class="loading">Loading current site...</div>
            </div>

            <div class="zen-mode">
                <p style="margin-bottom: 10px; font-size: 14px;">Need focus time?</p>
                <button class="zen-btn" id="zenModeBtn">Enter Zen Mode</button>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="dailyProgress" style="width: 0%"></div>
            </div>
            <p style="text-align: center; font-size: 12px; opacity: 0.8; margin-top: 5px;">Daily Goal Progress</p>
        </div>

        <!-- Goals Tab -->
        <div class="tab-content" id="goals">
            <div class="goal-input">
                <input type="number" id="dailyHours" placeholder="Daily hours goal" min="1" max="12" value="6">
                <span style="color: white; align-self: center;">hours</span>
            </div>
            
            <div class="goal-input">
                <input type="number" id="focusTime" placeholder="Focus time blocks" min="1" max="8" value="4">
                <span style="color: white; align-self: center;">blocks</span>
            </div>

            <button class="btn btn-primary" id="saveGoals" style="width: 100%;">Save Goals</button>

            <div style="margin-top: 20px; padding: 15px; background: rgba(255, 255, 255, 0.1); border-radius: 8px;">
                <h3 style="margin-bottom: 10px; font-size: 16px;">Quick Goals</h3>
                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                    <button class="btn" style="background: rgba(255, 255, 255, 0.2); color: white; padding: 6px 12px; font-size: 12px;" onclick="setQuickGoal(4)">4h Focus</button>
                    <button class="btn" style="background: rgba(255, 255, 255, 0.2); color: white; padding: 6px 12px; font-size: 12px;" onclick="setQuickGoal(6)">6h Productive</button>
                    <button class="btn" style="background: rgba(255, 255, 255, 0.2); color: white; padding: 6px 12px; font-size: 12px;" onclick="setQuickGoal(8)">8h Deep Work</button>
                </div>
            </div>
        </div>

        <!-- Analytics Tab -->
        <div class="tab-content" id="analytics">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="weekAverage">0h 0m</div>
                    <div class="stat-label">Week Avg</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="topSiteTime">0m</div>
                    <div class="stat-label">Top Site</div>
                </div>
            </div>

            <div style="margin-bottom: 15px;">
                <h3 style="margin-bottom: 10px; font-size: 16px;">Top Sites Today</h3>
                <div class="top-sites" id="topSites">
                    <div class="loading">Loading analytics...</div>
                </div>
            </div>

            <button class="btn btn-primary" id="exportData" style="width: 100%;">Export Data</button>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
